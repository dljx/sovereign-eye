<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sovereign Engine v1.0 — Portfolio Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="positions.js"></script>
  <script>
    // Load mobile.jsx first (sets window.MobileApp), then load app.jsx.
    // app.jsx detects viewport width and renders either MobileApp or App.
    function injectScript(code, wrap) {
      const s = document.createElement("script");
      s.textContent = wrap ? "(function(){\n" + code + "\n})();" : code;
      document.body.appendChild(s);
    }

    fetch("mobile.jsx")
      .then(r => r.text())
      .then(code => {
        injectScript(Babel.transform(code, { presets: ["react"] }).code, false);
        return fetch("app.jsx");
      })
      .then(r => r.text())
      .then(code => {
        injectScript(Babel.transform(code, { presets: ["react"] }).code, true);
      })
      .catch(err => {
        document.getElementById("root").innerHTML =
          '<pre style="color:#f87171;padding:20px;font-family:monospace">Failed to load:\n' + err.message + '</pre>';
      });
  </script>
</body>
</html>
